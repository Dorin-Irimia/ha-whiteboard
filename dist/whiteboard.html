<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Whiteboard</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #fff; }
  whiteboard-board { position: fixed; inset: 0; }
</style>
</head>
<body>
<whiteboard-board id="board"></whiteboard-board>
<script type="module">
  import './whiteboard-card.js';
  // Parameters / Parametri:
  //   ?key=office  separate board      ?lang=ro  toolbar language (auto = browser)
  //   ?grid=0      no dot grid         ?clean=1  start with the toolbar hidden
  const q = new URLSearchParams(location.search);
  const board = document.getElementById('board');
  board.options = {
    storageKey: q.get('key') ? 'ha_whiteboard_' + q.get('key') : 'ha_whiteboard_v3',
    grid: q.get('grid') !== '0',
    hideToolbar: q.get('clean') === '1',
    language: q.get('lang') || 'en'
  };
</script>
</body>
</html>
