<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Whiteboard</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #fff; }
  whiteboard-board { position: fixed; inset: 0; }
</style>
</head>
<body>
<whiteboard-board id="board"></whiteboard-board>
<script type="module">
  import './whiteboard-card.js';
  // ?key=birou  -> tabla separata; ?grid=0 -> fara grila; ?clean=1 -> porneste cu butoanele ascunse
  const q = new URLSearchParams(location.search);
  const board = document.getElementById('board');
  board.options = {
    storageKey: q.get('key') ? 'ha_whiteboard_' + q.get('key') : 'ha_whiteboard_v3',
    grid: q.get('grid') !== '0',
    hideToolbar: q.get('clean') === '1'
  };
</script>
</body>
</html>
