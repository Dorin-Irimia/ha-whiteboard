name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  consistency:
    name: Card copies match
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: dist and the integration must ship the same card
        run: |
          diff -q dist/whiteboard-card.js \
                  custom_components/ha_whiteboard/frontend/whiteboard-card.js
      - name: Card version must match the manifest version
        run: |
          card=$(grep -m1 "const VERSION = " dist/whiteboard-card.js | sed "s/.*'\(.*\)'.*/\1/")
          man=$(python3 -c "import json;print(json.load(open('custom_components/ha_whiteboard/manifest.json'))['version'])")
          echo "card=$card manifest=$man"
          test "$card" = "$man"

  python:
    name: Python syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q custom_components
