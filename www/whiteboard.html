<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Whiteboard</title>
<style>
  :root {
    --panel: rgba(35,37,41,0.92);
    --panel-border: #3a3d44;
    --ink: #f2f1ee;
    --muted: #9a9da3;
    --accent: #5eb1ff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #ffffff;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    touch-action: none;
  }
  #canvasWrap {
    position: absolute;
    inset: 0;
    overflow: hidden;
    background: #ffffff;
  }
  #board {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: block;
  }
  #objectLayer {
    position: absolute;
    top: 0; left: 0;
    width: 0; height: 0;
    transform-origin: 0 0;
    pointer-events: none;
  }

  /* ---------- Toolbar (overlay, ascundibil) ---------- */
  #toolbar {
    position: absolute;
    top: 8px; left: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px;
    background: var(--panel);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    flex-wrap: wrap;
    max-width: calc(100% - 16px);
    z-index: 20;
    transition: opacity .18s ease, transform .18s ease;
  }
  body.chrome-hidden #toolbar,
  body.chrome-hidden #hint {
    opacity: 0;
    transform: translateY(-12px);
    pointer-events: none;
  }
  .group {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 8px;
    background: rgba(27,29,33,0.85);
    border-radius: 10px;
    border: 1px solid var(--panel-border);
  }
  .swatch {
    width: 24px; height: 24px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
    flex-shrink: 0;
  }
  .swatch.active { border-color: var(--ink); }
  #customColor {
    width: 26px; height: 26px;
    border: none; border-radius: 50%;
    padding: 0; background: none; cursor: pointer;
  }
  input[type="range"] { width: 70px; accent-color: var(--accent); }
  button {
    background: #2c2f35;
    color: var(--ink);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 6px 9px;
    font-size: 12.5px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
  }
  button:active { background: #3a3e46; }
  button.active-tool { background: var(--accent); color: #10131a; border-color: var(--accent); }
  #brushPreview { border-radius: 50%; background: var(--ink); flex-shrink: 0; }
  #zoomLabel { font-size: 12px; color: var(--muted); min-width: 38px; text-align: center; }

  /* ---------- Buton de ascundere ---------- */
  #chromeToggle {
    position: absolute;
    right: 10px; bottom: 10px;
    width: 42px; height: 42px;
    padding: 0;
    justify-content: center;
    border-radius: 50%;
    background: var(--panel);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    border: 1px solid var(--panel-border);
    font-size: 16px;
    opacity: 0.5;
    z-index: 30;
    transition: opacity .18s ease;
  }
  #chromeToggle:hover { opacity: 1; }
  body.chrome-hidden #chromeToggle { opacity: 0.22; }
  body.chrome-hidden #chromeToggle:hover { opacity: 0.9; }

  /* ---------- Obiecte (emoji / text) ---------- */
  .obj {
    position: absolute;
    pointer-events: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    cursor: move;
    border: 1px solid transparent;
  }
  .obj.emoji { line-height: 1; }
  .obj.text {
    font-family: -apple-system, sans-serif;
    color: #111;
    padding: 2px 4px;
    outline: none;
    overflow: visible;
    white-space: nowrap;
  }
  .obj.selected { border: 1px dashed var(--accent); }
  .handle {
    position: absolute;
    width: 18px; height: 18px;
    background: var(--accent);
    border-radius: 50%;
    right: -9px; bottom: -9px;
    cursor: nwse-resize;
    display: none;
  }
  .obj.selected .handle { display: block; }
  .del-handle {
    position: absolute;
    width: 18px; height: 18px;
    background: #e03131;
    color: #fff;
    border-radius: 50%;
    right: -9px; top: -9px;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    cursor: pointer;
  }
  .obj.selected .del-handle { display: flex; }

  #emojiPanel {
    position: absolute;
    top: 8px;
    right: 8px;
    background: var(--panel);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 6px;
    display: none;
    grid-template-columns: repeat(6, 1fr);
    gap: 2px;
    max-width: 260px;
    z-index: 21;
  }
  #emojiPanel.open { display: grid; }
  body.chrome-hidden #emojiPanel { display: none; }
  .emoji-btn { font-size: 20px; background: none; border: none; padding: 4px; cursor: pointer; border-radius: 6px; }
  .emoji-btn:active { background: #3a3e46; }

  #hint {
    position: absolute;
    bottom: 10px;
    left: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: var(--muted);
    background: rgba(0,0,0,0.45);
    padding: 4px 6px 4px 9px;
    border-radius: 8px;
    z-index: 20;
    max-width: 70%;
    transition: opacity .18s ease, transform .18s ease;
  }
  #hint.gone { display: none; }
  #hintClose {
    padding: 0;
    width: 18px; height: 18px;
    justify-content: center;
    border-radius: 50%;
    font-size: 11px;
    background: #2c2f35;
    flex-shrink: 0;
  }
</style>
</head>
<body>
<div id="canvasWrap">
  <canvas id="board"></canvas>
  <div id="objectLayer"></div>
</div>

<div id="toolbar">
  <div class="group" id="colorGroup">
    <div class="swatch active" style="background:#111111" data-color="#111111"></div>
    <div class="swatch" style="background:#e03131" data-color="#e03131"></div>
    <div class="swatch" style="background:#2f9e44" data-color="#2f9e44"></div>
    <div class="swatch" style="background:#1971c2" data-color="#1971c2"></div>
    <div class="swatch" style="background:#f08c00" data-color="#f08c00"></div>
    <input type="color" id="customColor" value="#111111" title="Culoare personalizată">
  </div>

  <div class="group">
    <span id="brushPreview" style="width:8px;height:8px;"></span>
    <input type="range" id="sizeSlider" min="1" max="40" value="4">
  </div>

  <div class="group">
    <button id="penBtn" class="active-tool">✏️ Creion</button>
    <button id="eraserBtn">🧹 Radieră</button>
    <button id="textBtn">🔤 Text</button>
    <button id="panBtn">✋ Mută vedere</button>
  </div>

  <div class="group">
    <button id="zoomOutBtn">−</button>
    <span id="zoomLabel">100%</span>
    <button id="zoomInBtn">+</button>
    <button id="zoomResetBtn" title="Înapoi la centru">⤢ Reset</button>
    <button id="gridBtn" title="Grilă">▦</button>
  </div>

  <div class="group">
    <button id="emojiToggle">🙂 Emoji</button>
    <button id="undoBtn">↶ Undo</button>
    <button id="clearBtn">🗑️ Șterge tot</button>
    <button id="saveBtn">💾 Salvează</button>
  </div>
</div>

<div id="emojiPanel"></div>

<div id="hint">
  <span>Pânză infinită · Mută: 2 degete / ✋ / rotiță · Zoom: pinch sau Ctrl+scroll · Ascunde butoanele: tasta H</span>
  <button id="hintClose" title="Ascunde permanent">✕</button>
</div>

<button id="chromeToggle" title="Ascunde/arată butoanele (H)">✕</button>

<script>
(function() {
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const wrap = document.getElementById('canvasWrap');
  const objectLayer = document.getElementById('objectLayer');
  const sizeSlider = document.getElementById('sizeSlider');
  const brushPreview = document.getElementById('brushPreview');
  const penBtn = document.getElementById('penBtn');
  const eraserBtn = document.getElementById('eraserBtn');
  const textBtn = document.getElementById('textBtn');
  const panBtn = document.getElementById('panBtn');
  const emojiToggle = document.getElementById('emojiToggle');
  const emojiPanel = document.getElementById('emojiPanel');
  const clearBtn = document.getElementById('clearBtn');
  const undoBtn = document.getElementById('undoBtn');
  const saveBtn = document.getElementById('saveBtn');
  const gridBtn = document.getElementById('gridBtn');
  const customColor = document.getElementById('customColor');
  const zoomInBtn = document.getElementById('zoomInBtn');
  const zoomOutBtn = document.getElementById('zoomOutBtn');
  const zoomResetBtn = document.getElementById('zoomResetBtn');
  const zoomLabel = document.getElementById('zoomLabel');
  const chromeToggle = document.getElementById('chromeToggle');
  const hint = document.getElementById('hint');
  const hintClose = document.getElementById('hintClose');

  const STORAGE_KEY = 'ha_whiteboard_v3';
  const LEGACY_KEY  = 'ha_whiteboard_v2';
  const UI_KEY      = 'ha_whiteboard_ui';

  let color = '#111111';
  let size = 4;
  let tool = 'pen'; // 'pen' | 'eraser' | 'text' | 'pan' | 'emoji'
  let pendingEmoji = null;
  let selectedObj = null;

  // Pânza este infinită: totul se ține în coordonate "lume", nu în pixeli de ecran.
  let strokes = [];          // [{ color, size, pts: [x,y,x,y,...] }]
  let current = null;
  let legacy = null;         // imagine importată din versiunea veche (PNG)
  let showGrid = true;

  let zoom = 1, panX = 0, panY = 0;
  const ZOOM_MIN = 0.05, ZOOM_MAX = 8;

  const history = [];
  const HISTORY_LIMIT = 40;

  const EMOJIS = ['😀','😂','😍','😎','🤔','👍','👎','❤️','🔥','⭐','✅','❌',
                  '🎉','☀️','🌧️','❄️','⚡','💧','🏠','🚗','⏰','📌','💡','⚠️'];

  // ---------- UI: ascundere butoane / hint ----------
  function loadUI() {
    let ui = {};
    try { ui = JSON.parse(localStorage.getItem(UI_KEY) || '{}'); } catch (err) {}
    if (ui.chromeHidden) document.body.classList.add('chrome-hidden');
    if (ui.hintClosed) hint.classList.add('gone');
    if (ui.showGrid === false) showGrid = false;
    syncChromeIcon();
    gridBtn.classList.toggle('active-tool', showGrid);
  }
  function saveUI() {
    try {
      localStorage.setItem(UI_KEY, JSON.stringify({
        chromeHidden: document.body.classList.contains('chrome-hidden'),
        hintClosed: hint.classList.contains('gone'),
        showGrid: showGrid
      }));
    } catch (err) {}
  }
  function syncChromeIcon() {
    chromeToggle.textContent = document.body.classList.contains('chrome-hidden') ? '☰' : '✕';
  }
  function toggleChrome() {
    document.body.classList.toggle('chrome-hidden');
    if (document.body.classList.contains('chrome-hidden')) emojiPanel.classList.remove('open');
    syncChromeIcon();
    saveUI();
  }
  chromeToggle.addEventListener('click', toggleChrome);
  hintClose.addEventListener('click', () => { hint.classList.add('gone'); saveUI(); });
  window.addEventListener('keydown', (e) => {
    if (e.target && (e.target.isContentEditable || e.target.tagName === 'INPUT')) return;
    if (e.key === 'h' || e.key === 'H') { toggleChrome(); }
  });

  // ---------- Emoji panel ----------
  EMOJIS.forEach(e => {
    const b = document.createElement('button');
    b.className = 'emoji-btn';
    b.textContent = e;
    b.addEventListener('click', () => {
      pendingEmoji = e;
      tool = 'emoji';
      setActiveToolButton(null);
      emojiPanel.classList.remove('open');
    });
    emojiPanel.appendChild(b);
  });

  function setActiveToolButton(activeBtn) {
    [penBtn, eraserBtn, textBtn, panBtn].forEach(b => b.classList.remove('active-tool'));
    if (activeBtn) activeBtn.classList.add('active-tool');
  }
  penBtn.addEventListener('click', () => { tool = 'pen'; setActiveToolButton(penBtn); deselect(); });
  eraserBtn.addEventListener('click', () => { tool = 'eraser'; setActiveToolButton(eraserBtn); deselect(); });
  textBtn.addEventListener('click', () => { tool = 'text'; setActiveToolButton(textBtn); deselect(); });
  panBtn.addEventListener('click', () => { tool = 'pan'; setActiveToolButton(panBtn); deselect(); });

  document.querySelectorAll('.swatch').forEach(sw => {
    sw.addEventListener('click', () => {
      document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
      sw.classList.add('active');
      color = sw.dataset.color;
      if (selectedObj && selectedObj.dataset.type === 'text') selectedObj.style.color = color;
      else { tool = 'pen'; setActiveToolButton(penBtn); }
    });
  });
  customColor.addEventListener('input', () => {
    document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
    color = customColor.value;
    if (selectedObj && selectedObj.dataset.type === 'text') selectedObj.style.color = color;
    else { tool = 'pen'; setActiveToolButton(penBtn); }
  });
  sizeSlider.addEventListener('input', () => {
    size = parseInt(sizeSlider.value, 10);
    brushPreview.style.width = Math.max(4, size) + 'px';
    brushPreview.style.height = Math.max(4, size) + 'px';
  });
  emojiToggle.addEventListener('click', () => emojiPanel.classList.toggle('open'));
  gridBtn.addEventListener('click', () => {
    showGrid = !showGrid;
    gridBtn.classList.toggle('active-tool', showGrid);
    saveUI();
    render();
  });

  // ---------- Canvas / render ----------
  let vw = 0, vh = 0, dpr = 1;

  function resizeCanvas() {
    dpr = window.devicePixelRatio || 1;
    const rect = wrap.getBoundingClientRect();
    vw = rect.width; vh = rect.height;
    canvas.width = Math.round(vw * dpr);
    canvas.height = Math.round(vh * dpr);
    render();
  }

  function worldTransform() {
    ctx.setTransform(dpr * zoom, 0, 0, dpr * zoom, dpr * panX, dpr * panY);
  }

  // Grila se desenează în coordonate de ecran (puncte mereu la fel de mari),
  // dar este ancorată în lume, deci se mișcă odată cu pânza.
  function drawGrid() {
    if (!showGrid) return;
    let step = 40;
    while (step * zoom < 22) step *= 2;
    while (step * zoom > 90) step /= 2;
    const sp = step * zoom;
    const ox = ((panX % sp) + sp) % sp;
    const oy = ((panY % sp) + sp) % sp;
    const r = 2;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#ccd2dc';
    ctx.beginPath();
    for (let x = ox; x < vw; x += sp) {
      for (let y = oy; y < vh; y += sp) {
        ctx.rect(Math.round(x) - r / 2, Math.round(y) - r / 2, r, r);
      }
    }
    ctx.fill();
  }

  function drawStroke(s) {
    const p = s.pts;
    if (p.length < 2) return;
    ctx.strokeStyle = s.color;
    ctx.lineWidth = s.size;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    if (p.length === 2) {
      // punct singular
      ctx.moveTo(p[0], p[1]);
      ctx.lineTo(p[0] + 0.01, p[1]);
    } else {
      ctx.moveTo(p[0], p[1]);
      for (let i = 2; i < p.length; i += 2) ctx.lineTo(p[i], p[i + 1]);
    }
    ctx.stroke();
  }

  function render() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    drawGrid();
    worldTransform();
    if (legacy && legacy.img && legacy.img.complete) {
      ctx.drawImage(legacy.img, 0, 0, legacy.w, legacy.h);
    }
    for (const s of strokes) drawStroke(s);
    if (current) drawStroke(current);
    zoomLabel.textContent = Math.round(zoom * 100) + '%';
  }

  let rafPending = false;
  function scheduleRender() {
    if (rafPending) return;
    rafPending = true;
    requestAnimationFrame(() => { rafPending = false; render(); });
  }

  function applyTransform() {
    objectLayer.style.transform =
      'translate(' + panX + 'px,' + panY + 'px) scale(' + zoom + ')';
    scheduleRender();
  }

  // ---------- Zoom / Pan ----------
  function clampZoom(z) { return Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, z)); }

  function zoomAt(newZoom, mx, my) {
    newZoom = clampZoom(newZoom);
    const localX = (mx - panX) / zoom;
    const localY = (my - panY) / zoom;
    panX = mx - newZoom * localX;
    panY = my - newZoom * localY;
    zoom = newZoom;
    applyTransform();
    saveViewSoon();
  }

  zoomInBtn.addEventListener('click', () => zoomAt(zoom * 1.25, vw / 2, vh / 2));
  zoomOutBtn.addEventListener('click', () => zoomAt(zoom / 1.25, vw / 2, vh / 2));
  zoomResetBtn.addEventListener('click', () => {
    zoom = 1; panX = 0; panY = 0; applyTransform(); saveViewSoon();
  });

  wrap.addEventListener('wheel', (e) => {
    e.preventDefault();
    const r = wrap.getBoundingClientRect();
    const mx = e.clientX - r.left, my = e.clientY - r.top;
    if (e.ctrlKey || e.metaKey) {
      zoomAt(zoom * (e.deltaY < 0 ? 1.1 : 0.9), mx, my);
    } else {
      // rotița mută pânza (Shift = orizontal)
      if (e.shiftKey) panX -= e.deltaY; else { panX -= e.deltaX; panY -= e.deltaY; }
      applyTransform();
      saveViewSoon();
    }
  }, { passive: false });

  // ---------- Coordonate ----------
  function toWorld(clientX, clientY) {
    const r = wrap.getBoundingClientRect();
    return {
      x: (clientX - r.left - panX) / zoom,
      y: (clientY - r.top - panY) / zoom
    };
  }

  // ---------- Istoric ----------
  function snapshot() {
    return { strokes: strokes.slice(), objects: serializeObjects() };
  }
  function pushHistory() {
    history.push(snapshot());
    if (history.length > HISTORY_LIMIT) history.shift();
  }

  // ---------- Desen ----------
  let drawing = false;

  function startDraw(clientX, clientY) {
    const p = toWorld(clientX, clientY);
    if (tool === 'eraser') {
      pushHistory();
      drawing = true;
      eraseAt(p.x, p.y);
      return;
    }
    pushHistory();
    drawing = true;
    current = { color: color, size: size, pts: [p.x, p.y] };
  }

  function moveDraw(clientX, clientY) {
    if (!drawing) return;
    const p = toWorld(clientX, clientY);
    if (tool === 'eraser') { eraseAt(p.x, p.y); return; }
    if (!current) return;
    const n = current.pts.length;
    const dx = p.x - current.pts[n - 2], dy = p.y - current.pts[n - 1];
    if (dx * dx + dy * dy < (0.6 / zoom) * (0.6 / zoom)) return;
    current.pts.push(p.x, p.y);
    // desenăm doar segmentul nou peste ce există deja (rapid, fără redraw total)
    worldTransform();
    ctx.strokeStyle = current.color;
    ctx.lineWidth = current.size;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(current.pts[n - 2], current.pts[n - 1]);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
  }

  function endDraw() {
    if (!drawing) return;
    drawing = false;
    if (current) {
      if (current.pts.length >= 2) strokes.push(current);
      current = null;
      render();
    }
    saveSoon();
  }

  // Radiera taie traseele în bucăți (funcționează pe pânză infinită, fără „pete albe")
  function distToSeg(px, py, x1, y1, x2, y2) {
    const dx = x2 - x1, dy = y2 - y1;
    const len2 = dx * dx + dy * dy;
    let t = len2 ? ((px - x1) * dx + (py - y1) * dy) / len2 : 0;
    t = Math.max(0, Math.min(1, t));
    return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
  }

  function eraseAt(wx, wy) {
    const radius = Math.max(6, size * 2) ;
    let changed = false;
    const next = [];
    for (const s of strokes) {
      const lim = radius + s.size / 2;
      const p = s.pts;
      let hit = false;
      for (let i = 0; i < p.length - 2; i += 2) {
        if (distToSeg(wx, wy, p[i], p[i + 1], p[i + 2], p[i + 3]) <= lim) { hit = true; break; }
      }
      if (!hit && p.length === 2 && Math.hypot(wx - p[0], wy - p[1]) <= lim) hit = true;
      if (!hit) { next.push(s); continue; }
      changed = true;
      // păstrăm bucățile rămase
      let run = [];
      for (let i = 0; i < p.length; i += 2) {
        if (Math.hypot(wx - p[i], wy - p[i + 1]) > lim) {
          run.push(p[i], p[i + 1]);
        } else {
          if (run.length >= 4) next.push({ color: s.color, size: s.size, pts: run });
          run = [];
        }
      }
      if (run.length >= 4) next.push({ color: s.color, size: s.size, pts: run });
    }
    if (changed) { strokes = next; scheduleRender(); saveSoon(); }
  }

  // ---------- Obiecte (emoji / text) ----------
  function deselect() {
    if (selectedObj) selectedObj.classList.remove('selected');
    selectedObj = null;
  }
  function selectObj(el) {
    if (selectedObj && selectedObj !== el) selectedObj.classList.remove('selected');
    selectedObj = el;
    el.classList.add('selected');
  }

  function buildObject(o) {
    const el = document.createElement('div');
    el.className = 'obj ' + o.type;
    el.dataset.type = o.type;
    el.style.left = o.left + 'px';
    el.style.top = o.top + 'px';
    el.style.width = o.width + 'px';
    el.style.height = o.height + 'px';
    el.style.fontSize = o.fontSize + 'px';
    if (o.type === 'text') {
      el.contentEditable = 'true';
      el.style.color = o.color || '#111';
    }
    el.textContent = o.content;

    const handle = document.createElement('div');
    handle.className = 'handle';
    el.appendChild(handle);
    const del = document.createElement('div');
    del.className = 'del-handle';
    del.textContent = '✕';
    el.appendChild(del);

    objectLayer.appendChild(el);
    attachObjEvents(el, handle, del);
    return el;
  }

  function createObject(type, x, y, content) {
    pushHistory();
    const w = type === 'emoji' ? 44 : 120;
    const h = type === 'emoji' ? 44 : 40;
    const el = buildObject({
      type: type,
      left: x - w / 2, top: y - h / 2,
      width: w, height: h,
      fontSize: type === 'emoji' ? Math.round(h * 0.8) : 20,
      color: color,
      content: type === 'emoji' ? content : (content || 'Text')
    });
    selectObj(el);
    if (type === 'text') {
      requestAnimationFrame(() => { el.focus(); document.execCommand('selectAll', false, null); });
    }
    saveSoon();
    return el;
  }

  function attachObjEvents(el, handle, del) {
    let mode = null, moved = false;
    let startClientX = 0, startClientY = 0;
    let startLeft = 0, startTop = 0, startW = 0, startH = 0;

    function pointerDown(e) {
      const t = e.touches ? e.touches[0] : e;
      startClientX = t.clientX; startClientY = t.clientY;
      startLeft = parseFloat(el.style.left);
      startTop = parseFloat(el.style.top);
      startW = parseFloat(el.style.width);
      startH = parseFloat(el.style.height);
      selectObj(el);
      mode = (e.target === handle) ? 'resize' : 'move';
      moved = false;
      e.stopPropagation();
      e.preventDefault();
    }
    function pointerMove(e) {
      if (!mode) return;
      const t = e.touches ? e.touches[0] : e;
      if (!moved) { moved = true; pushHistory(); }
      const dx = (t.clientX - startClientX) / zoom;
      const dy = (t.clientY - startClientY) / zoom;
      if (mode === 'move') {
        el.style.left = (startLeft + dx) + 'px';
        el.style.top = (startTop + dy) + 'px';
      } else {
        const newW = Math.max(20, startW + dx);
        const newH = Math.max(20, startH + dy);
        el.style.width = newW + 'px';
        el.style.height = newH + 'px';
        el.style.fontSize = (el.dataset.type === 'emoji'
          ? Math.round(Math.min(newW, newH) * 0.8)
          : Math.round(newH * 0.5)) + 'px';
      }
      e.preventDefault();
    }
    function pointerUp() { if (mode) { mode = null; saveSoon(); } }

    el.addEventListener('mousedown', pointerDown);
    window.addEventListener('mousemove', pointerMove);
    window.addEventListener('mouseup', pointerUp);
    el.addEventListener('touchstart', pointerDown, { passive: false });
    window.addEventListener('touchmove', pointerMove, { passive: false });
    window.addEventListener('touchend', pointerUp);

    del.addEventListener('mousedown', (e) => e.stopPropagation());
    del.addEventListener('click', (e) => {
      e.stopPropagation();
      pushHistory();
      el.remove();
      if (selectedObj === el) selectedObj = null;
      saveSoon();
    });
    el.addEventListener('dblclick', () => { if (el.dataset.type === 'text') el.focus(); });
    el.addEventListener('blur', () => saveSoon());
  }

  // ---------- Rutare pointer pe pânză ----------
  let panning = false, panStartX = 0, panStartY = 0, panOrigX = 0, panOrigY = 0;
  const activeTouches = new Map();
  let pinchStartDist = 0, pinchStartZoom = 1, pinchWorld = null;

  function midpoint(t1, t2) {
    return { x: (t1.clientX + t2.clientX) / 2, y: (t1.clientY + t2.clientY) / 2 };
  }
  function dist(t1, t2) {
    return Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
  }

  canvas.addEventListener('mousedown', (e) => {
    if (tool === 'pan' || e.button === 1 || e.button === 2) {
      panning = true;
      panStartX = e.clientX; panStartY = e.clientY;
      panOrigX = panX; panOrigY = panY;
      e.preventDefault();
      return;
    }
    if (tool === 'emoji' && pendingEmoji) {
      const p = toWorld(e.clientX, e.clientY);
      createObject('emoji', p.x, p.y, pendingEmoji);
      return;
    }
    if (tool === 'text') {
      const p = toWorld(e.clientX, e.clientY);
      createObject('text', p.x, p.y, '');
      return;
    }
    deselect();
    startDraw(e.clientX, e.clientY);
  });
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  window.addEventListener('mousemove', (e) => {
    if (panning) {
      panX = panOrigX + (e.clientX - panStartX);
      panY = panOrigY + (e.clientY - panStartY);
      applyTransform();
      return;
    }
    moveDraw(e.clientX, e.clientY);
  });
  window.addEventListener('mouseup', () => {
    if (panning) { panning = false; saveViewSoon(); }
    endDraw();
  });

  canvas.addEventListener('touchstart', (e) => {
    for (const t of e.changedTouches) activeTouches.set(t.identifier, t);
    if (activeTouches.size === 2) {
      // două degete = mută + zoom, indiferent de unealtă
      drawing = false; current = null; panning = false;
      const pts = Array.from(activeTouches.values());
      const r = wrap.getBoundingClientRect();
      const mid = midpoint(pts[0], pts[1]);
      pinchStartDist = dist(pts[0], pts[1]) || 1;
      pinchStartZoom = zoom;
      pinchWorld = {
        x: (mid.x - r.left - panX) / zoom,
        y: (mid.y - r.top - panY) / zoom
      };
      render();
      e.preventDefault();
      return;
    }
    if (activeTouches.size === 1) {
      const t = e.touches[0];
      if (tool === 'pan') {
        panning = true; panStartX = t.clientX; panStartY = t.clientY;
        panOrigX = panX; panOrigY = panY;
      } else if (tool === 'emoji' && pendingEmoji) {
        const p = toWorld(t.clientX, t.clientY);
        createObject('emoji', p.x, p.y, pendingEmoji);
      } else if (tool === 'text') {
        const p = toWorld(t.clientX, t.clientY);
        createObject('text', p.x, p.y, '');
      } else {
        deselect();
        startDraw(t.clientX, t.clientY);
      }
    }
    e.preventDefault();
  }, { passive: false });

  canvas.addEventListener('touchmove', (e) => {
    for (const t of e.changedTouches) if (activeTouches.has(t.identifier)) activeTouches.set(t.identifier, t);
    if (activeTouches.size === 2 && pinchWorld) {
      const pts = Array.from(activeTouches.values());
      const r = wrap.getBoundingClientRect();
      const mid = midpoint(pts[0], pts[1]);
      zoom = clampZoom(pinchStartZoom * (dist(pts[0], pts[1]) / pinchStartDist));
      panX = (mid.x - r.left) - pinchWorld.x * zoom;
      panY = (mid.y - r.top) - pinchWorld.y * zoom;
      applyTransform();
      e.preventDefault();
      return;
    }
    if (panning) {
      const t = e.touches[0];
      panX = panOrigX + (t.clientX - panStartX);
      panY = panOrigY + (t.clientY - panStartY);
      applyTransform();
    } else if (drawing) {
      const t = e.touches[0];
      moveDraw(t.clientX, t.clientY);
    }
    e.preventDefault();
  }, { passive: false });

  canvas.addEventListener('touchend', (e) => {
    for (const t of e.changedTouches) activeTouches.delete(t.identifier);
    if (activeTouches.size < 2) { pinchStartDist = 0; pinchWorld = null; saveViewSoon(); }
    if (activeTouches.size === 0) {
      if (panning) { panning = false; saveViewSoon(); }
      endDraw();
    }
  });

  wrap.addEventListener('mousedown', (e) => {
    if (e.target === wrap) deselect();
  });

  // ---------- Șterge / Undo / Export ----------
  clearBtn.addEventListener('click', () => {
    pushHistory();
    strokes = [];
    current = null;
    legacy = null;
    objectLayer.querySelectorAll('.obj').forEach(el => el.remove());
    selectedObj = null;
    render();
    saveSoon();
  });

  undoBtn.addEventListener('click', () => {
    const snap = history.pop();
    if (!snap) return;
    strokes = snap.strokes.slice();
    current = null;
    objectLayer.querySelectorAll('.obj').forEach(el => el.remove());
    selectedObj = null;
    snap.objects.forEach(buildObject);
    render();
    saveSoon();
  });
  window.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undoBtn.click(); }
  });

  function contentBounds() {
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const s of strokes) {
      const m = s.size / 2;
      for (let i = 0; i < s.pts.length; i += 2) {
        if (s.pts[i] - m < minX) minX = s.pts[i] - m;
        if (s.pts[i] + m > maxX) maxX = s.pts[i] + m;
        if (s.pts[i + 1] - m < minY) minY = s.pts[i + 1] - m;
        if (s.pts[i + 1] + m > maxY) maxY = s.pts[i + 1] + m;
      }
    }
    objectLayer.querySelectorAll('.obj').forEach(el => {
      const x = parseFloat(el.style.left), y = parseFloat(el.style.top);
      const w = parseFloat(el.style.width), h = parseFloat(el.style.height);
      minX = Math.min(minX, x); minY = Math.min(minY, y);
      maxX = Math.max(maxX, x + w); maxY = Math.max(maxY, y + h);
    });
    if (legacy) {
      minX = Math.min(minX, 0); minY = Math.min(minY, 0);
      maxX = Math.max(maxX, legacy.w); maxY = Math.max(maxY, legacy.h);
    }
    if (!isFinite(minX)) {
      // nimic desenat: exportăm vederea curentă
      return { x: -panX / zoom, y: -panY / zoom, w: vw / zoom, h: vh / zoom };
    }
    const pad = 40;
    return { x: minX - pad, y: minY - pad, w: (maxX - minX) + pad * 2, h: (maxY - minY) + pad * 2 };
  }

  saveBtn.addEventListener('click', () => {
    const b = contentBounds();
    const scale = Math.min(2, Math.max(1, 2400 / Math.max(b.w, b.h)));
    const tmp = document.createElement('canvas');
    tmp.width = Math.max(1, Math.round(b.w * scale));
    tmp.height = Math.max(1, Math.round(b.h * scale));
    const t = tmp.getContext('2d');
    t.fillStyle = '#ffffff';
    t.fillRect(0, 0, tmp.width, tmp.height);
    t.setTransform(scale, 0, 0, scale, -b.x * scale, -b.y * scale);
    if (legacy && legacy.img) t.drawImage(legacy.img, 0, 0, legacy.w, legacy.h);
    for (const s of strokes) {
      if (s.pts.length < 2) continue;
      t.strokeStyle = s.color; t.lineWidth = s.size;
      t.lineCap = 'round'; t.lineJoin = 'round';
      t.beginPath();
      t.moveTo(s.pts[0], s.pts[1]);
      for (let i = 2; i < s.pts.length; i += 2) t.lineTo(s.pts[i], s.pts[i + 1]);
      t.stroke();
    }
    objectLayer.querySelectorAll('.obj').forEach(el => {
      const x = parseFloat(el.style.left), y = parseFloat(el.style.top);
      const w = parseFloat(el.style.width), h = parseFloat(el.style.height);
      const fs = parseFloat(el.style.fontSize) || 20;
      if (el.dataset.type === 'emoji') {
        t.font = fs + 'px sans-serif';
        t.textAlign = 'center'; t.textBaseline = 'middle';
        t.fillStyle = '#111';
        t.fillText(el.textContent, x + w / 2, y + h / 2);
      } else {
        t.font = fs + 'px -apple-system, sans-serif';
        t.fillStyle = el.style.color || '#111';
        t.textAlign = 'left'; t.textBaseline = 'middle';
        t.fillText(el.textContent, x + 4, y + h / 2);
      }
    });
    const link = document.createElement('a');
    link.download = 'whiteboard-' + new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-') + '.png';
    link.href = tmp.toDataURL('image/png');
    link.click();
  });

  // ---------- Persistență ----------
  function serializeObjects() {
    return Array.from(objectLayer.querySelectorAll('.obj')).map(el => ({
      type: el.dataset.type,
      left: parseFloat(el.style.left),
      top: parseFloat(el.style.top),
      width: parseFloat(el.style.width),
      height: parseFloat(el.style.height),
      fontSize: parseFloat(el.style.fontSize) || 20,
      color: el.style.color || null,
      content: el.textContent
    }));
  }

  let saveTimer = null;
  function saveSoon() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(doSave, 400);
  }
  function saveViewSoon() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(doSave, 800);
  }
  function doSave() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        strokes: strokes.map(s => ({ c: s.color, w: s.size, p: s.pts.map(n => Math.round(n * 10) / 10) })),
        objects: serializeObjects(),
        view: { zoom: zoom, panX: panX, panY: panY },
        legacy: legacy ? { src: legacy.src, w: legacy.w, h: legacy.h } : null
      }));
    } catch (err) {}
  }

  function loadLegacyImage(src, w, h) {
    const img = new Image();
    img.onload = () => {
      legacy = {
        src: src,
        w: w || img.naturalWidth / (window.devicePixelRatio || 1),
        h: h || img.naturalHeight / (window.devicePixelRatio || 1),
        img: img
      };
      render();
    };
    img.src = src;
  }

  function restore() {
    let data = null;
    try { data = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); } catch (err) {}

    if (!data) {
      // migrare din versiunea veche (pânză fixă salvată ca PNG)
      let old = null;
      try { old = JSON.parse(localStorage.getItem(LEGACY_KEY) || 'null'); } catch (err) {}
      if (old) {
        if (old.png) loadLegacyImage(old.png, null, null);
        (old.objects || []).forEach(o => buildObject({
          type: o.type,
          left: parseFloat(o.left) || 0,
          top: parseFloat(o.top) || 0,
          width: parseFloat(o.width) || 44,
          height: parseFloat(o.height) || 44,
          fontSize: parseFloat(o.fontSize) || 20,
          color: o.color,
          content: o.content
        }));
        saveSoon();
      }
      return;
    }

    strokes = (data.strokes || []).map(s => ({ color: s.c, size: s.w, pts: s.p }));
    (data.objects || []).forEach(buildObject);
    if (data.legacy && data.legacy.src) loadLegacyImage(data.legacy.src, data.legacy.w, data.legacy.h);
    if (data.view) {
      zoom = clampZoom(data.view.zoom || 1);
      panX = data.view.panX || 0;
      panY = data.view.panY || 0;
    }
  }

  // ---------- Start ----------
  loadUI();
  window.addEventListener('resize', resizeCanvas);
  restore();
  resizeCanvas();
  applyTransform();
  brushPreview.style.width = size + 'px';
  brushPreview.style.height = size + 'px';
})();
</script>
</body>
</html>
